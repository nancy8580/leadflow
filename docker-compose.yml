services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/leadflow.db
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - leadflow-data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  leadflow-data:
